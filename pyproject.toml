[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Autonomous aerial security for gated residential communities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ramu Roy", email = "royramu694429@gmail.com" }]
keywords = ["uav", "drone", "security", "computer-vision", "ros2", "ardupilot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies are declared per-subsystem rather than in one flat list,
# because the deployment targets diverge sharply: the companion computer never
# installs the training stack, and the backend never installs MAVSDK.
dependencies = [
    "pydantic>=2.7",
    "structlog>=24.1",
]

[project.optional-dependencies]

# Model training and evaluation. GPU workstation only.
train = [
    "torch>=2.3",
    "torchvision>=0.18",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9",
    "pycocotools>=2.0.7",
    "albumentations>=1.4",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "tqdm>=4.66",
]

# Inference on the companion computer. Deliberately excludes torch: the
# deployed detector runs through ONNX Runtime / TensorRT, not PyTorch.
infer = [
    "onnxruntime-gpu>=1.18; platform_machine == 'x86_64'",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9",
]

# Flight autonomy. ROS 2 itself is installed from apt, not pip.
flight = [
    "mavsdk>=2.0",
    "pymavlink>=2.4.41",
    "pyproj>=3.6",
    "shapely>=2.0",
    "transforms3d>=0.4",
]

# Backend services.
services = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "nats-py>=2.7",
    "redis>=5.0",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]

dev = [
    "aegis[train,flight,services]",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis*", "perception*", "services*"]

# ---------------------------------------------------------------------------
# Ruff — linting and formatting. One tool instead of flake8+isort+black.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["autonomy/build", "autonomy/install", "autonomy/log"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "ASYNC",     # async correctness
    "S",         # bandit security
    "PTH",       # use pathlib
]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "S101",    # assert is fine in tests, and pytest requires it
    "B008",    # FastAPI's Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]
"perception/notebooks/**" = ["E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["aegis", "perception", "services"]

# ---------------------------------------------------------------------------
# mypy — typed where it pays. Strict on the domain model and services;
# lenient on training scripts where the numeric stack is poorly typed.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["perception.training.*", "perception.notebooks.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Deliberately does NOT include ultralytics: ADR-0004 forbids the import
# entirely, so an ignore rule for it would quietly permit one.
module = ["cv2.*", "mavsdk.*", "pymavlink.*", "albumentations.*", "rfdetr.*", "sahi.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: takes more than a second",
    "sitl: requires a running ArduPilot SITL instance",
    "gpu: requires a CUDA device",
    "integration: requires the docker compose stack",
]

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/notebooks/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
